name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create html folder structure
        run: |
          # Create a temporary directory with html folder
          mkdir -p deploy/html
          # Copy all files to html folder
          cp -r * deploy/html/ || true
          cp -r .* deploy/html/ || true
          
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy
          clean: true
