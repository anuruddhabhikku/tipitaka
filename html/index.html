<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipiṭaka Pāli Reader</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <header class="main-header">
            <h1>Tipiṭaka Pāli Reader</h1>
            <p class="subtitle">Complete Pāli Canon with English Translation</p>
        </header>

        <main class="nikaya-container">
            <div class="nikaya-list">

                <div class="nikaya-item">
                    <div class="nikaya-header-clickable" onclick="toggleNikaya('dn')">
                        <h2>Dīgha Nikāya</h2>
                        <span class="expand-icon" id="nikaya-icon-dn">▶</span>
                    </div>
                    <div class="vagga-list" id="nikaya-dn-vaggas" style="display: none;">
                        <div class="loading">Loading vaggas...</div>
                    </div>
                </div>

                <div class="nikaya-item">
                    <div class="nikaya-header-clickable" onclick="toggleNikaya('mn')">
                        <h2>Majjhima Nikāya</h2>
                        <span class="expand-icon" id="nikaya-icon-mn">▶</span>
                    </div>
                    <div class="vagga-list" id="nikaya-mn-vaggas" style="display: none;">
                        <div class="loading">Loading vaggas...</div>
                    </div>
                </div>

            </div>
        </main>

        <footer class="main-footer">
            <p>Generated from AI-translated Pāli Tipiṭaka</p>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
